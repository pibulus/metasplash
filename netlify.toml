# Added 2026-07-31 to bring metasplash.app back online. It had been serving
# Cloudflare 530s (origin unreachable) since the Pi went down for the EliteDesk
# migration. Its Open Graph tags, og-image.png and icon set were all correct
# the whole time — there was simply nothing running to serve them, which is why
# the share card looked broken.
#
# DEPLOY_TARGET=netlify is what makes svelte.config.js choose adapter-netlify
# over adapter-node. It must exist BOTH here and as an environment variable on
# the Netlify project: set only here, a `netlify deploy --build` from a laptop
# still produces a Node server bundle that Netlify cannot serve, and the deploy
# reports success while changing nothing. That trap left cryptkeep and
# corruptor stale for hours before it was spotted.
#
# adapter-netlify writes static assets to build/ and any function to .netlify/.
#
# NOTE: no [[headers]] CSP block. This app declares its Content-Security-Policy
# through SvelteKit's kit.csp (hash mode) in svelte.config.js, which covers
# prerendered and server-rendered pages alike. Adding a second source here
# would conflict — that is exactly how ZipList briefly ended up with no CSP.
#
# Careful with `rm -rf .netlify` when cleaning: that directory holds both the
# adapter output AND Netlify's state.json project link. Deleting it unlinks the
# project until you `netlify link --name <site>`.
[build]
  command = "npm run build"
  publish = "build"

[build.environment]
  DEPLOY_TARGET = "netlify"
